dependencies {
    handheldImplementation files('libs/javet-node-android-6.0.2.aar')
    tvImplementation files('libs/javet-node-android-6.0.2.aar')
    compileOnly files('libs/zxing-core-3.3.3.jar')
    tvLegacyImplementation files('libs/zxing-core-3.3.3.jar')
    tvLegacyImplementation files('libs/multidex-2.0.1.aar')
tvLegacyCompileOnly files('libs/javet-compile-only.jar')
    tv32CompileOnly files('libs/javet-compile-only.jar')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

tasks.register('verifyEmbeddedBundle') {
    inputs.files('src/main/node/bootstrap.cjs', 'src/main/assets/echo-api.zip', 'src/main/assets/embedded-api.json')
    doLast {
        def archive = file('src/main/assets/echo-api.zip')
        def manifest = new groovy.json.JsonSlurper().parse(file('src/main/assets/embedded-api.json'))
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
        if (digest != manifest.sha256) throw new GradleException('Bundled API checksum mismatch. Run scripts/prepare_embedded.py.')
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def bundled = zip.getInputStream(zip.getEntry('bootstrap.cjs')).bytes
            if (!java.util.Arrays.equals(bundled, file('src/main/node/bootstrap.cjs').bytes)) throw new GradleException('Bundled API is stale. Run scripts/prepare_embedded.py.')
            if (zip.getEntry('node_modules/axios/package.json') == null) throw new GradleException('Bundled API dependencies are missing.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyEmbeddedBundle' }

