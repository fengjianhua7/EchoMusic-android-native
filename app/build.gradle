apply plugin: 'com.android.application'

android {
    namespace 'cc.echomusic.android'
    compileSdk 35
    defaultConfig {
        applicationId 'cc.echomusic.android'
        minSdk 26
        targetSdk 35
        buildConfigField 'boolean', 'NODE_MOBILE', 'false'
        buildConfigField 'boolean', 'MGV2000', 'false'
        versionCode 18
        versionName '0.10.5-android'
    }
    buildFeatures { buildConfig true }
    signingConfigs { handheldOriginal { initWith debug; def originalKey = new File(System.getProperty('user.home'), '.android/debug.keystore'); if(originalKey.exists()) storeFile originalKey } }
    flavorDimensions 'device'
    productFlavors {
        handheld { signingConfig signingConfigs.handheldOriginal; versionCode 25; versionName '0.11.8-android'; dimension 'device'; buildConfigField 'boolean', 'TV', 'false'; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
        tvLegacy { minSdk 19; versionCode 28; versionName '0.10.15-android'; buildConfigField 'boolean', 'MGV2000', 'true'; multiDexEnabled true; dimension 'device'; applicationIdSuffix '.tv.legacy'; versionNameSuffix '-tv-api19'; buildConfigField 'boolean', 'TV', 'true'; buildConfigField 'boolean', 'NODE_MOBILE', 'false' }
        tv32 { minSdk 23; dimension 'device'; applicationIdSuffix '.tv'; versionNameSuffix '-tv-armv7'; buildConfigField 'boolean', 'TV', 'true'; buildConfigField 'boolean', 'NODE_MOBILE', 'true'; ndk { abiFilters 'armeabi-v7a' } }
        tv { dimension 'device'; applicationIdSuffix '.tv'; versionNameSuffix '-tv'; buildConfigField 'boolean', 'TV', 'true'; ndk { abiFilters 'arm64-v8a' } }
    }
    sourceSets { tvLegacy { res.srcDirs = ['src/tv/res', 'src/tvLegacy/res'] }; tv32 { manifest.srcFile 'src/tv32/AndroidManifest.xml'; res.srcDirs = ['src/tv/res'] } }
    buildTypes {
        tvOptimized { initWith debug; debuggable false; signingConfig signingConfigs.debug; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-tv.pro'; matchingFallbacks=['debug'] }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


// Host-side timing tests: no emulator or additional test dependencies required.
tasks.register('compileLyricsContract', JavaCompile) {
    source 'src/main/java/cc/echomusic/android/Lyrics.java', '../tests/LyricsContractTest.java'
    classpath = files('../tests/lib/json-20240303.jar')
    destinationDirectory = layout.buildDirectory.dir('lyrics-contract')
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.register('lyricsContractTest', JavaExec) {
    dependsOn 'compileLyricsContract'
    classpath = files(layout.buildDirectory.dir('lyrics-contract'), '../tests/lib/json-20240303.jar')
    mainClass = 'cc.echomusic.android.LyricsContractTest'
}

